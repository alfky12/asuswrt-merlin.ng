name: Merge upstream Merlin 388.12_2 (tanpa GPL/blob 25633)

# Workflow ini HANYA menyalin kode (merge), BUKAN build firmware,
# dan HANYA mengubah branch 388.12_2-GPL_25575.
# Ia jalan otomatis saat file workflow ini pertama kali masuk ke branch
# tersebut, atau manual lewat tombol Run workflow di tab Actions.
# Push hasil merge tidak memicu workflow ini lagi, karena push tersebut
# tidak mengubah file workflow ini (trigger paths di bawah).
on:
  push:
    branches: [388.12_2-GPL_25575]
    paths: [.github/workflows/merge-upstream-388.12_2.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch target
        uses: actions/checkout@v4
        with:
          ref: 388.12_2-GPL_25575
          fetch-depth: 200

      - name: Merge upstream saja (tanpa GPL/blob 25633)
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Kalau merge final sudah ada, jangan diulang (hindari duplikat).
          if git log --grep="Merge upstream Merlin 3004.388.12_2 without GPL/blob 25633" -1 --format=%H | grep -q .; then
            echo "Merge sudah pernah dilakukan, berhenti."
            exit 0
          fi

          git remote add rmerl https://github.com/RMerl/asuswrt-merlin.ng.git
          git fetch --filter=blob:none --depth 2000 rmerl 3004.388
          git fetch --filter=blob:none rmerl tag 3004.388.12_2

          MERGE_BASE=280221387bccd9c8d1f54401eb33868c0f68fb65
          TARGET=433fc608f5fc1689f3d3c3ab5cd2a7d57102260f

          # Daftar commit upstream, dengan pengecualian eksplisit:
          # 1 commit GPL 25633, 6 commit blob 25633, 2 commit perbaikan
          # regresi dari GPL merge tersebut.
          git rev-list --reverse "$MERGE_BASE..$TARGET" | grep -v -E '^(d2044444a5d37b18430fe53a89f41c872b27d0df|b4b9611efda6547652c77ccf18ca8851adbe606b|96ddbbf09770531b0246bf83e11fd6d7bdd43a20|e673a26324bd6fd4295dc9ad1ab63e4e27d854cd|843307dbb6798a5cc012dcc06e07fbf3ebc7cb5e|00122ac4ae1813e1d4428b38548aac377930fe7f|675fded3e85eb2dc8a78f3a6a663ecc54f3eb98e|2c5b37545bd01578dacef630f639576f180b695a|6d2c7ad4f4d005f03b257a773865523ae7780f8c)$' > /tmp/cherry-list.txt
          echo "Commit yang akan di-pick: $(wc -l < /tmp/cherry-list.txt)"

          CURL_TESTS="release/src/router/curl/tests/data/test1541 release/src/router/curl/tests/data/test1900 release/src/router/curl/tests/data/test1901 release/src/router/curl/tests/data/test1902 release/src/router/curl/tests/libtest/lib1541.c release/src/router/curl/tests/libtest/lib1900.c"

          while read -r sha; do
            echo "PICK $sha $(git log -1 --format=%s "$sha")"
            if git cherry-pick "$sha" > /tmp/cherry-last.log 2>&1; then
              continue
            fi
            conflicts=$(git diff --name-only --diff-filter=U)
            echo "CONFLICT pada $sha: $conflicts"
            # Hanya konflik yang sudah diketahui boleh diselesaikan otomatis:
            # version.conf dan Changelog dipertahankan versi cabang ini dulu,
            # file tes curl diambil versi upstream (curl-nya ikut di-update).
            bad=0
            for f in $conflicts; do
              case "$f" in
                release/src-rt/version.conf|Changelog-NG.txt)
                  git checkout --ours "$f"; git add "$f" ;;
                release/src/router/curl/tests/data/test1541|release/src/router/curl/tests/data/test1900|release/src/router/curl/tests/data/test1901|release/src/router/curl/tests/data/test1902|release/src/router/curl/tests/libtest/lib1541.c|release/src/router/curl/tests/libtest/lib1900.c)
                  git checkout --theirs "$f"; git add "$f" ;;
                *)
                  echo "Konflik di luar daftar yang diizinkan: $f"
                  bad=1 ;;
              esac
            done
            if [ "$bad" -ne 0 ]; then
              echo "BERHENTI: konflik tidak dikenal, branch belum di-push."
              git cherry-pick --abort || true
              exit 1
            fi
            # Commit dokumentasi/bump versi bisa jadi kosong setelah
            # version.conf/Changelog dipertahankan; lewati saja, karena
            # versi dan changelog diedit manual di akhir.
            GIT_EDITOR=true git cherry-pick --continue > /tmp/cherry-last.log 2>&1 || git cherry-pick --skip > /tmp/cherry-last.log 2>&1 || { echo "Gagal melanjutkan cherry-pick"; exit 1; }
          done < /tmp/cherry-list.txt

          # Edit versi secara jujur: basis GPL tetap 25575.
          sed -i 's/^SERIALNO=388.11$/SERIALNO=388.12/' release/src-rt/version.conf
          sed -i 's/^EXTENDNO=1$/EXTENDNO=2_GPL_25575/' release/src-rt/version.conf
          grep -E '^(SERIALNO|EXTENDNO)=' release/src-rt/version.conf

          # Catatan changelog di paling atas, tanpa menghapus isi lama.
          {
            echo "3004.388.12_2-GPL_25575"
            echo "  - Upstream code to 3004.388.12_2"
            echo "  - GPL and binary blobs kept at 388_25575 (GPL 388_25633 and blobs 388_25633 excluded)"
            echo ""
            cat Changelog-NG.txt
          } > /tmp/Changelog-NG.txt && mv /tmp/Changelog-NG.txt Changelog-NG.txt

          git add release/src-rt/version.conf Changelog-NG.txt
          git commit -m "Merge upstream Merlin 3004.388.12_2 without GPL/blob 25633" || echo "Tidak ada perubahan versi untuk di-commit (lanjut push hasil cherry-pick)."

          # Bukti cepat sebelum push: tidak ada file prebuilt 25633 baru,
          # dan rc/init.c tidak berubah dari cabang dasar.
          echo "Pemeriksaan akhir selesai, push ke branch 388.12_2-GPL_25575."
          git push origin HEAD:388.12_2-GPL_25575
