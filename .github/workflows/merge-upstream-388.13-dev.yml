name: Merge gnuton + upstream Merlin 388.13-dev (tanpa GPL/blob 25633)

# Workflow ini HANYA menyalin kode (merge), BUKAN build firmware,
# dan HANYA mengubah branch 388.13-dev-GPL_25575.
# Ia jalan otomatis saat file workflow ini pertama kali masuk ke branch
# tersebut, atau manual lewat tombol Run workflow di tab Actions.
# Push hasil merge tidak memicu workflow ini lagi, karena push tersebut
# tidak mengubah file workflow ini (trigger paths di bawah).
on:
  push:
    branches: [388.13-dev-GPL_25575]
    paths: [.github/workflows/merge-upstream-388.13-dev.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout branch target
        uses: actions/checkout@v4
        with:
          ref: 388.13-dev-GPL_25575
          fetch-depth: 0

      - name: Merge gnuton + upstream Merlin (sudah terbukti bersih secara lokal)
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Kalau commit OpenSSL 3.5 untuk TUF sudah ada, merge sudah pernah dilakukan, jangan diulang.
          if git log --grep="build: use OpenSSL 3.5 for TUF targets to follow Merlin 388.13" -1 --format=%H | grep -q .; then
            echo "Merge sudah pernah dilakukan, berhenti."
            exit 0
          fi

          git remote add gnuton https://github.com/gnuton/asuswrt-merlin.ng.git
          git remote add rmerl https://github.com/RMerl/asuswrt-merlin.ng.git
          # Fetch PENUH tanpa filter dan tanpa batas kedalaman.
          # Alasan: fetch hemat (blob:none/shallow) pernah gagal di run lama
          # saat cherry-pick meminta blob dadakan dari promisor remote.
          git fetch gnuton master
          git fetch rmerl 3004.388
          git fetch rmerl tag 3004.388.12_2

          # --- Tahap 1: gnuton, 11 commit yang dipilih ---
          # Dari 15 commit gnuton sesudah merge-base 3004.388.11 (8af85751),
          # 4 dilewati dengan sengaja:
          #  - 2 commit hanya Changelog-NG.txt (5b897281, 163144cb)
          #  - 1 commit manifest rilis lama 388.11_1-gnuton1 (4183e0c5)
          #  - 1 commit workflow PR dari fork (92e9b311), karena workflow build
          #    Alf sengaja berbeda (manual, hanya TUF-AX3000/5400 default)
          for sha in 16963d3256a4466779e73b40d9f2ecef3c3be2ea d4b52e11bdc0102daf0328c4d1091c6f01af4b4d d2f7558a9ff862180d2e58133ad3074faffc7e74 1e1339a1017bb813bae156cb45077fd8bf4de416 ab96beba647c8c80f758bdcda8a31cd38f3ae228 522d56bf0626ac58e8707ec5de904f7733d27852 856ab45dffbd0c37e7fffaf05289904654c304a0 5d1354255e236b4dc83da8be99de67793673696d e2121dda71efa9554492015b652d45f93b84b83b a7ab641c0d04fc88e942e673b5c7dca89d621461 14166d1af5fc9a115c66f187e1618977b732682d; do
            echo "PICK gnuton $sha $(git log -1 --format=%s "$sha")"
            git cherry-pick "$sha" < /dev/null || { echo "PICK GAGAL gnuton $sha"; git status --porcelain; exit 1; }
          done

          # --- Tahap 2: RMerl 388.12_2 -> head 388.13-dev, 33 commit ---
          # Rentang penuh 433fc608..f94f6ff8 adalah 40 commit.
          # 7 dilewati dengan sengaja, karena versi/changelog diedit manual di akhir:
          #  - 1 commit bump revision ke 388.13 alpha1 (607b5770)
          #  - 6 commit hanya "Updated changelog" (e4246f18, 33579231, 18376cb6, 04a477b9, aef47ca6, f94f6ff8)
          # Tidak ada commit GPL/blob 25633 di rentang ini, jadi tidak ada
          # pengecualian GPL/blob tambahan di sini.
          for sha in f7dca7a3db12a099a85b0f0c17d7d5cd6d0c7b44 94d65e48c10634b45e51ba858348ba8410f04898 1438679fe47a7c11474792cffe6122286064e6bf 1204aba82606aba84427afb5362c21c7cb87105f fff8b6b0d7ee6bd25138e89c883d51f95cb91722 28c1e3237fcc5f318b687dd6035bc0628d233341 9dbb6ca7ebc3ab8bfa86c1ef58b99ed4ffa59565 de9f647d2a9196870c5b46b43a903d8eb7bd93c7 19fdcc9d6d4a69f24657e82209a5570a380bc47b c299200df3b7a3772dda5ab94bf939941006d389 5a874bd3865abd7b2ecfef8fd976fb1f093af1dd 2fd23b77abe3337346de6f44825b4c9c017d7c60 a2e7f5afd509916cccf4b4ffc3e5a2b10a518dc1 7c740cd0a62c6b1cfa18d2617faceb58065ea2f6 67b5a93b2d7c21b77a196efe90841770e740dded eb2081e1cb8519c586b6503a19163b86a1088451 bbc978cdc5d40b595fd7499fb6f8148745c2118a f886ec15f02c82755baf62d319fd78cb7520c888 dae24b90096ee0d819bac4a8d3fcb6de54b45333 c01ccfac89aa7d269307f01a83450e17d3daa094 12c1a067fca6d72d691af8c6eb3a3026d0a50bfe 45d0bc39ccb01f7072747d28e630032c52033ed7 e5893ddecda1956da8b7d87808f3d2bd5182a78a 60f68c6cc227ed4efde297c835d2d3dcdb4b22ba ad4a8039e84766fb8816f26936764b37b588e796 55f256c9890d928ebd2509fff84779a0a309cfe6 b62a4a72720b1e3b69aed9f2f1ecb37139a66f05 e9d87bbf5a1ccd03ac250750110013ed7ead45f8 8b30a828c86bc9e4b8667d8a6e95bc0d02d97fda 9008fb9f98b05b488e5df55b5d8471c69d4f608c d3318770574a73e1c93a85ff0d5981ab586d6040 d39daf3c1c38e87c4f059d809a7a3a2abb464725 d46b7c562543554c80b47bdc31bfc9c5e8ad250c; do
            echo "PICK rmerl $sha $(git log -1 --format=%s "$sha")"
            git cherry-pick "$sha" < /dev/null || { echo "PICK GAGAL rmerl $sha"; git status --porcelain; exit 1; }
          done

          # Edit versi secara jujur: basis GPL tetap 25575.
          sed -i 's/^SERIALNO=388.12$/SERIALNO=388.13/' release/src-rt/version.conf
          sed -i 's/^EXTENDNO=2_GPL_25575$/EXTENDNO=dev_GPL_25575/' release/src-rt/version.conf
          grep -E '^(SERIALNO|EXTENDNO)=' release/src-rt/version.conf

          # Catatan changelog di paling atas, tanpa menghapus isi lama.
          {
            echo "3004.388.13-dev-GPL_25575"
            echo "  - Upstream code to RMerl 3004.388 head f94f6ff8 (388.13 in development)"
            echo "  - Synced with gnuton master 14166d1a (11 commits picked, 4 skipped: 2 Changelog-only, 1 old 388.11_1 release manifest, 1 fork-PR build workflow)"
            echo "  - GPL and binary blobs kept at 388_25575 (no GPL/blob merge in the 388.12_2..388.13-dev range)"
            echo "  - AiProtection TUF override replaced by symlink to the main Merlin page (see following commit)"
            echo ""
            cat Changelog-NG.txt
          } > /tmp/Changelog-NG.txt && mv /tmp/Changelog-NG.txt Changelog-NG.txt

          git add release/src-rt/version.conf Changelog-NG.txt
          git commit -m "Bump version to 388.13-dev_GPL_25575 (GPL/blob kept at 25575)"

          # AiProtection: file TUF-AX3000 jadi symlink ke file utama Merlin.
          # Symlink TUF-AX5400 dibiarkan, ia menunjuk ke file AX3000 ini,
          # sehingga rantai AX5400 -> AX3000 -> file utama tetap utuh.
          rm release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp
          ln -s ../../../AiProtection_HomeProtection.asp release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp
          ls -l release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp
          readlink -f release/src/router/www/sysdep/TUF-AX5400/www/AiProtection_HomeProtection.asp
          git add release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp
          git commit -m "webui: make TUF-AX3000 AiProtection a symlink to the main Merlin page"

          # Ikut Merlin untuk OpenSSL: target TUF masih OPENSSL11=y di target.mak,
          # sementara config_base RMerl 388.13 sudah OPENSSL35=y. Tanpa perubahan ini,
          # Makefile build akan menimpa config_base kembali ke 1.1 untuk TUF.
          # Hanya baris export TUF-* yang diubah, model lain dibiarkan.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("release/src-rt/target.mak")
          lines = p.read_text().splitlines(True)
          for i, line in enumerate(lines):
              if line.startswith("export TUF-") and "OPENSSL11=y" in line:
                  lines[i] = line.replace("OPENSSL11=y", "OPENSSL35=y")
          p.write_text(''.join(lines))
          PY
          # Tambah satu baris changelog dengan cara biner, supaya CRLF di
          # entri lama tidak ikut berubah menjadi LF.
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("Changelog-NG.txt")
          data = p.read_bytes()
          needle = b"AiProtection TUF override replaced by symlink to the main Merlin page (see following commit)\n"
          insert = b"  - TUF targets switched to OpenSSL 3.5 (OPENSSL35) to follow Merlin 388.13\n"
          p.write_bytes(data.replace(needle, needle + insert, 1))
          PY
          git add release/src-rt/target.mak Changelog-NG.txt
          git commit -m "build: use OpenSSL 3.5 for TUF targets to follow Merlin 388.13"

          # Bukti cepat sebelum push.
          echo "wan0_proto di OpenVPN: $(grep -c wan0_proto release/src/router/www/Advanced_VPN_OpenVPN.asp) (harus 5)"
          echo "Google di AiProtection lewat symlink: $(grep -c Google release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp) (harus 0)"
          echo "OPENSSL35 untuk TUF: $(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak) (harus 3: AX5400, AX3000, AX3000_V2)"
          test "$(grep -c wan0_proto release/src/router/www/Advanced_VPN_OpenVPN.asp)" = "5"
          test "$(grep -c Google release/src/router/www/sysdep/TUF-AX3000/www/AiProtection_HomeProtection.asp)" = "0"
          test "$(grep -c 'export TUF-.*OPENSSL35=y' release/src-rt/target.mak)" = "3"

          git push origin HEAD:388.13-dev-GPL_25575
